name: sr-ciden
channels:
  - conda-forge
  - pytorch
dependencies:
  - python=3.12
  - pip
  - numpy=1.26.4
  - scipy=1.11.4
  - matplotlib=3.8.4
  - pip:
      # CPU PyTorch baseline for CI; for CUDA, prefer conda forge/pytorch wheels or official indexes
      - torch==2.3.1
      - tqdm==4.66.4
      - torchdiffeq==0.2.3
      # Docs extras
      - mkdocs==1.6.0
      - mkdocs-material==9.5.30
      - mkdocstrings[python]==0.26.1
      - pymdown-extensions==10.8.1
      # Dev/test/tooling
      - pytest==8.3.3
      - pytest-cov==5.0.0
      - hypothesis==6.112.3
      - ruff==0.6.9
      - black==24.8.0
      - isort==5.13.2
      - mypy==1.10.0
      - pre-commit==3.7.1
      - nbconvert==7.16.4
      - jupyter==1.0.0
      - pip-tools==7.4.1
      - pip-audit==2.7.3
      - bandit==1.7.9
      - nbstripout==0.7.1
#
# To use CUDA builds:
# - Prefer pinned conda packages: pytorch, pytorch-cuda=<version> from nvidia channel (Linux)
# - Or pip with official extra-index-url per PyTorch installation guide
# - Document CUDA variants alongside torch version for reproducibility
