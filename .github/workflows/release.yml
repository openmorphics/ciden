name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-publish-pypi:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  github-release:
    name: Create GitHub Release and attach artifacts
    runs-on: ubuntu-latest
    needs: build-publish-pypi
    steps:
      - uses: actions/checkout@v4

      - name: Prepare archives
        run: |
          tar czf artifacts.tgz artifacts || true
          tar czf results.tgz results || true
          ls -al

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts.tgz
            results.tgz

  docs:
    name: Build and deploy docs to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-publish-pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.in
            pyproject.toml

      - name: Install docs tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e .[docs]

      - name: Build docs
        run: mkdocs build --strict

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages

  docker:
    name: Build and push Docker image (if Dockerfile exists)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Dockerfile
        id: dockerfile
        run: |
          if [ -f docker/Dockerfile ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set image tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.dockerfile.outputs.present == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        if: steps.dockerfile.outputs.present == 'true'
        run: docker build -t ghcr.io/openmorphics/ciden:${{ steps.tag.outputs.tag }} -f docker/Dockerfile .

      - name: Push image
        if: steps.dockerfile.outputs.present == 'true'
        run: docker push ghcr.io/openmorphics/ciden:${{ steps.tag.outputs.tag }}
