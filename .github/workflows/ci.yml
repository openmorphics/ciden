name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  tests:
    name: Lint • Typecheck • Tests • Examples • Docs (Python ${{ matrix.python }} • ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.in
            pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project (dev+docs)
        run: pip install -e .[dev,docs]

      - name: Show environment
        run: |
          python -V
          pip list

      - name: Lint (ruff)
        run: |
          ruff format --check .
          ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Imports order (isort)
        run: isort --check-only .

      - name: Typecheck (mypy)
        run: mypy src tests examples benchmarks

      - name: Unit and property tests (pytest)
        run: pytest -q

      - name: Example smoke test
        run: python examples/minimal_training_loop.py

      - name: Build docs (MkDocs)
        run: mkdocs build --strict

      - name: Security - pip-audit
        run: pip-audit -r requirements-lock.txt --strict

      - name: Security - bandit
        run: bandit -r src -ll

      - name: Upload artifacts and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-artifacts-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            results/**
            artifacts/**
          if-no-files-found: ignore
