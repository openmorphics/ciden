# Pre-commit configuration for SR-CIDEN
# Run: pip install pre-commit && pre-commit install
minimum_pre_commit_version: "3.0.0"

default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        files: ^(src|tests|benchmarks|examples)/.*\.py$
        additional_dependencies: []

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: ["-ll", "-q"]
        files: ^src/.*\.py$

  - repo: https://github.com/pypa/pip-audit
    rev: v2.7.3
    hooks:
      - id: pip-audit
        # Use the compiled lock when present; otherwise it will analyze the environment.
        args: ["-r", "requirements-lock.txt", "--strict"]
        # Keep as manual to avoid blocking typical dev commits; run in CI.
        stages: ["manual"]

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: insert-license
        name: "Insert Apache-2.0 license header"
        files: ^(src|tests|benchmarks|examples)/.*\.py$
        args:
          - --license-filepath
          - LICENSE-HEADER
          - --comment-style
          - python